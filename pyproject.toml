[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-diagnosis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart", "PyYAML", "PyMuPDF", "fonttools", "python-docx", "qrcode"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
