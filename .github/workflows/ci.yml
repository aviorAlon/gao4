# Same checks as `python scripts/check.py`, on every push and pull request.
#
# Backend runs on both Linux and Windows: the desktop build ships on Windows, and a few code paths
# are platform-specific (the parent-process watchdog uses a Win32 handle wait there, pid polling
# elsewhere). Nothing here needs a model key — the test suite scrubs them and never makes paid calls.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # Read straight from pyproject.toml so there is one list of dependencies, not two.
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt pytest httpx
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
